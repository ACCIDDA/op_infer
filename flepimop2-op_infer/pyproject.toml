[project]
name = "flepimop2-op_infer"
version = "0.0.1"
readme = { file = "README.md", content-type = "text/markdown" }
description = "Connect op_infer calibration and design workflows to FlepiMoP2 process steps"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Joshua Macdonald", email = "jmacdo16@jh.edu" },
]
keywords = ["flepimop2", "op_infer", "inference", "calibration", "provider"]
dependencies = [
  "op_infer[study]==0.0.1",
  "flepimop2>=0.3.0",
  "pydantic>=2.0,<3",
  "numpy>=2.0",
  "click>=8.3",
]
classifiers = [
    "Private :: Do Not Upload",
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.urls]
Repository = "https://github.com/ACCIDDA/op_infer"
Issues = "https://github.com/ACCIDDA/op_infer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flepimop2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv.sources]
op_infer = { path = "..", editable = true }

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.13.3", "mypy>=1.18.2"]
