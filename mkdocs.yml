site_name: op_infer Documentation
repo_name: ACCIDDA/op_infer
repo_url: https://github.com/ACCIDDA/op_infer
edit_uri: ''
markdown_extensions:
  - pymdownx.snippets:
      base_path: .
      check_paths: true
theme:
  name: material
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
nav:
  - Home: index.md
  - Capabilities and example checks: capabilities.md
  - Execution roadmap: design/execution-roadmap.md
  - Design studies: design-studies.md
  - Likelihood targets: design/likelihood-targets.md
  - Numerical provenance: design/numerical-provenance.md
  - Forward models: forward-models.md
  - Pipeline performance: pipeline-performance.md
  - CUDA qualification: cuda-qualification.md
  - Priors and statistical observations: statistical-models.md
  - Structural and local information: identifiability.md
  - Posteriors: posteriors.md
  - Random streams: random-streams.md
  - Native NumPyro NUTS: numpyro.md
  - Named MCMC diagnostics: mcmc-diagnostics.md
  - Native masked NPE: sbi-npe.md
  - Rank-based calibration (SBC): calibration.md
  - Coverage planning and TARP: coverage-planning.md
  - Saved gate records: gates.md
  - SBC execution: sbc-runner.md
  - Masked-unit SBC: masked-sbc.md
  - API: api.md
  - Architecture and planned interfaces: design/proposal.md
